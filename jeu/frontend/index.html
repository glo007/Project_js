<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NextDrop</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header>
    <nav class="navbar dark-mode" role="navigation">
      <div class="navbar__logo">
        <h1>NextDrop</h1>
      </div>
      <ul class="navbar__links">
        <li class="navbar__link second"><a href="#">PlayStation</a></li>
        <li class="navbar__link four"><a href="#">XBOX</a></li>
        <li class="navbar__link three"><a href="#">Nintendo</a></li>
        <li class="navbar__link one"><a href="#">PC</a></li>
      </ul>
      <button class="burger" aria-label="Menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </nav>
  </header>

  <main>
    <h2 class="platform-title">PlayStation</h2>

    <div class="barrecherche">
      <input type="text" placeholder="SRecherche..." />
      <button type="submit">Search</button>
    </div>

    <!-- Section des jeux -->
    <section>
      <ul>
        <li class="jeu">
          <figure class="jeu1">
            <div class="number" role="region" aria-labelledby="number_1">
              <strong id="number_1">1</strong>
            </div>

            <img src="#" alt="Nom du jeu" />

            <figcaption>
              <h3>Nom du jeu</h3>
              <p><time datetime="2004-09-10">10/09/2004</time></p>
            </figcaption>

            <div class="project-jeu"
              data-img="#"
              data-desc="Description du jeu."
              data-tech="Solo, Multi">
            </div>
          </figure>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; NextDrop - <time datetime="2025">2025</time></p>

    <p><a href="#">Mention Legal</a></p>

    <div class="social-links">
      <a href="#" class="social-link" aria-label="Github">
        <img src="./asset/icons8-github.svg" alt="Github" />
      </a>
      <a href="#" class="social-link" aria-label="LinkedIn">
        <img src="./asset/icons8-linkedin.svg" alt="LinkedIn" />
      </a>
      <a href="#" class="social-link" aria-label="Twitter">
        <img src="./asset/icons8-twitter.svg" alt="Twitter" />
      </a>
    </div>
  </footer>
</body>
</html>
<script src="./app.js"></script>
