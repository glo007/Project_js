<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextDrop — Connexion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="navbar__logo">
        <h1 class="gradient-next">Next<strong class="gradient-drop">Drop</strong></h1>
      </div>
      <ul class="navbar__links">
        <li class="navbar__link"><a href="./index.html">Accueil</a></li>
        <li class="navbar__link"><a href="./communaute.html">Communauté</a></li>
      </ul>
      <button class="burger" aria-label="Menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
    </nav>
  </header>

  <h2 class="platform-title">Connexion</h2>

  <main class="form-page">
    <form id="login-form" class="card-form">
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="mot_de_passe" placeholder="Mot de passe" required />
      <button type="submit">Se connecter</button>
      <p class="form-msg" id="login-msg"></p>
      <p class="hint">Compte de test : test@nextdrop.fr / test1234</p>
      <p class="hint">Pas de compte ? <a class="link" href="./inscription.html">Inscrivez-vous</a></p>
    </form>
  </main>

  <footer>
    <p class="gradient-next">&copy; Next<strong class="gradient-drop">Drop</strong> - <time datetime="2025">2025</time></p>
  </footer>

  <script src="./community-core.js"></script>
  <script src="./connexion.js"></script>
</body>
</html>
