<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextDrop — Ajouter un jeu</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="navbar__logo">
        <h1 class="gradient-next">Next<strong class="gradient-drop">Drop</strong></h1>
      </div>
      <ul class="navbar__links">
        <li class="navbar__link"><a href="./index.html">Accueil</a></li>
        <li class="navbar__link"><a href="./communaute.html">Communauté</a></li>
      </ul>
      <button class="burger" aria-label="Menu">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </button>
    </nav>
  </header>

  <h2 class="platform-title">Ajouter un jeu</h2>

  <main class="form-page">
    <form id="add-game-form" class="card-form">
      <input type="text" name="titre" placeholder="Titre du jeu *" required />
      <textarea name="description" placeholder="Description * (obligatoire)" rows="5" required></textarea>
      <label class="file-label">
        Image (facultative)
        <input type="file" name="image" accept="image/*" />
      </label>
      <button type="submit">Publier le jeu</button>
      <p class="form-msg" id="add-game-msg"></p>
    </form>
  </main>

  <footer>
    <p class="gradient-next">&copy; Next<strong class="gradient-drop">Drop</strong> - <time datetime="2025">2025</time></p>
  </footer>

  <script src="./community-core.js"></script>
  <script src="./ajouter-jeu.js"></script>
</body>
</html>
